<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t">
  <title id="t">HeteroAccel decision pipeline: detect, check capabilities, plan, execute, fall back</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="50" width="196" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="128" y="86" font-size="26" fill="#38bdf8" font-weight="800">1</text>
      <text x="128" y="118" font-size="20" fill="#fff" font-weight="700">Detect</text>
      <text x="128" y="146" font-size="14" fill="#a5b4d8">CPU · memory</text>
      <text x="128" y="166" font-size="14" fill="#a5b4d8">Vulkan · CUDA probe</text>
    </g>
    <g>
      <rect x="258" y="50" width="196" height="150" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <text x="356" y="86" font-size="26" fill="#60a5fa" font-weight="800">2</text>
      <text x="356" y="118" font-size="20" fill="#fff" font-weight="700">Check</text>
      <text x="356" y="146" font-size="14" fill="#a5b4d8">quant types · architectures</text>
      <text x="356" y="166" font-size="14" fill="#a5b4d8">hardware gates</text>
    </g>
    <g>
      <rect x="486" y="50" width="196" height="150" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
      <text x="584" y="86" font-size="26" fill="#818cf8" font-weight="800">3</text>
      <text x="584" y="118" font-size="20" fill="#fff" font-weight="700">Plan</text>
      <text x="584" y="146" font-size="14" fill="#a5b4d8">analyze · plan</text>
      <text x="584" y="166" font-size="14" fill="#a5b4d8">residency · placement</text>
    </g>
    <g>
      <rect x="714" y="50" width="196" height="150" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
      <text x="812" y="86" font-size="26" fill="#a78bfa" font-weight="800">4</text>
      <text x="812" y="118" font-size="20" fill="#fff" font-weight="700">Execute</text>
      <text x="812" y="146" font-size="14" fill="#a5b4d8">llama.cpp or HydroXL</text>
      <text x="812" y="166" font-size="14" fill="#a5b4d8">schedule · profile</text>
    </g>
    <g>
      <rect x="942" y="50" width="228" height="150" rx="14" fill="#1e293b" stroke="#f0abfc" stroke-width="2"/>
      <text x="1056" y="86" font-size="26" fill="#f0abfc" font-weight="800">5</text>
      <text x="1056" y="118" font-size="20" fill="#fff" font-weight="700">Fall back safely</text>
      <text x="1056" y="146" font-size="14" fill="#a5b4d8">CPU engine on failure,</text>
      <text x="1056" y="166" font-size="14" fill="#a5b4d8">and says that it did</text>
    </g>
  </g>
  <g stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arr)">
    <path d="M228 125H254"/><path d="M456 125H482"/><path d="M684 125H710"/><path d="M912 125H938"/>
  </g>
</svg>
