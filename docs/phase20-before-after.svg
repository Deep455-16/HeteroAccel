<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Phase 20 HydroXL CPU before and after</title>
  <desc id="d">Cold load 2359.82 to 1655.77 ms; generation 1.18 to 2.48 tok/s; time to first token about 3948 to 1915.76 ms; peak RSS about 3100 to 2561.13 MB. Same machine, Release build, 5 runs.</desc>
  <rect width="1200" height="400" rx="16" fill="#0f172a"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="36" y="44" font-size="22" font-weight="800" fill="#fff">Phase 20 · HydroXL CPU, before vs after</text>
    <text x="36" y="68" font-size="14" fill="#94a3d8">same machine, Release build, same model · "~" marks approximate values from the report</text>
    <g font-size="13" fill="#e2e8ff">
      <rect x="860" y="36" width="14" height="14" rx="3" fill="#64748b"/><text x="882" y="48">Before</text>
      <rect x="950" y="36" width="14" height="14" rx="3" fill="#38bdf8"/><text x="972" y="48">After</text>
    </g>

    <!-- 4 panels, each 270 wide, bars max height 170 -->
    <!-- Panel 1: cold load (ms) before 2359.82 after 1655.77; max 2400 -->
    <g transform="translate(36,100)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#e2e8ff">Cold model load</text>
      <text x="0" y="18" font-size="12" fill="#94a3d8">ms · lower is better</text>
      <line x1="0" y1="230" x2="250" y2="230" stroke="#475569"/>
      <rect x="30" y="52" width="80" height="178" rx="6" fill="#64748b"/>
      <rect x="140" y="105" width="80" height="125" rx="6" fill="#38bdf8"/>
      <text x="70" y="44" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">2,359.82</text>
      <text x="180" y="97" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle">1,655.77</text>
    </g>
    <!-- Panel 2: generation tok/s before 1.18 after 2.48; max 2.6 -->
    <g transform="translate(336,100)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#e2e8ff">Generation throughput</text>
      <text x="0" y="18" font-size="12" fill="#94a3d8">tok/s · higher is better</text>
      <line x1="0" y1="230" x2="250" y2="230" stroke="#475569"/>
      <rect x="30" y="139" width="80" height="91" rx="6" fill="#64748b"/>
      <rect x="140" y="39" width="80" height="191" rx="6" fill="#38bdf8"/>
      <text x="70" y="131" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">1.18</text>
      <text x="180" y="31" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle">2.48 ± 0.23</text>
    </g>
    <!-- Panel 3: TTFT ms before ~3948 after 1915.76; max 4000 -->
    <g transform="translate(636,100)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#e2e8ff">Time to first token</text>
      <text x="0" y="18" font-size="12" fill="#94a3d8">ms · lower is better</text>
      <line x1="0" y1="230" x2="250" y2="230" stroke="#475569"/>
      <rect x="30" y="56" width="80" height="174" rx="6" fill="#64748b"/>
      <rect x="140" y="146" width="80" height="84" rx="6" fill="#38bdf8"/>
      <text x="70" y="48" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">~3,948</text>
      <text x="180" y="138" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle">1,915.76 ± 357.02</text>
    </g>
    <!-- Panel 4: peak RSS MB before ~3100 after 2561.13; max 3200 -->
    <g transform="translate(936,100)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#e2e8ff">Peak RSS</text>
      <text x="0" y="18" font-size="12" fill="#94a3d8">MB · lower is better</text>
      <line x1="0" y1="230" x2="230" y2="230" stroke="#475569"/>
      <rect x="25" y="45" width="70" height="185" rx="6" fill="#64748b"/>
      <rect x="125" y="77" width="70" height="153" rx="6" fill="#38bdf8"/>
      <text x="60" y="37" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">~3,100</text>
      <text x="160" y="69" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle">2,561.13</text>
    </g>
    <text x="36" y="384" font-size="12" fill="#64748b">Bars drawn to scale within each panel. Source: docs/phase20-improvements.md</text>
  </g>
</svg>
