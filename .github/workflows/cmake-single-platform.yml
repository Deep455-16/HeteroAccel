
name: HeteroAccel CMake CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: Ubuntu Vulkan + CPU Build
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout HeteroAccel
        uses: actions/checkout@v4

      # 2. Install build tools and system dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            ninja-build \
            git \
            pkg-config \
            ccache \
            python3 \
            python3-pip \
            libomp-dev

      # 3. Install Vulkan and SPIR-V dependencies
      - name: Install Vulkan and SPIR-V dependencies
        run: |
          sudo apt-get install -y \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            glslc \
            glslang-tools \
            spirv-tools \
            spirv-headers \
            libshaderc-dev

      # 4. Verify Vulkan and SPIR-V dependencies
      - name: Verify Vulkan dependencies
        run: |
          set -e

          echo "Checking Vulkan headers..."
          test -f /usr/include/vulkan/vulkan.h

          echo "Checking Vulkan compiler..."
          command -v glslc
          command -v glslangValidator

          echo "Checking SPIR-V tools..."
          command -v spirv-val
          command -v spirv-as

          echo "Checking Vulkan libraries..."
          ldconfig -p | grep libvulkan

          echo "Checking SPIR-V CMake configuration..."
          dpkg -L spirv-headers | grep -E \
            'SPIRV-HeadersConfig.cmake|spirv-headers-config.cmake'

          echo "Vulkan and SPIR-V dependencies verified."

      # 5. Verify available Vulkan runtime
      - name: Check Vulkan runtime
        run: |
          echo "Checking available Vulkan devices..."
          vulkaninfo --summary || true

      # 6. Configure CMake with Vulkan enabled
      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=17 \
            -DGGML_VULKAN=ON \
            -DGGML_CCACHE=ON \
            -DCMAKE_PREFIX_PATH="/usr"

      # 7. Build HeteroAccel, HydroXL and llama.cpp
      - name: Build HeteroAccel
        run: |
          cmake --build ${{github.workspace}}/build \
            --config ${{env.BUILD_TYPE}} \
            --parallel 2

      # 8. Verify generated build targets
      - name: Verify build outputs
        run: |
          echo "Build completed. Checking generated executables..."
          find build -type f -executable \
            \( -name "adaptive-gpu" -o -name "*.so" \) \
            -print

      # 9. Execute automated test suite
      - name: Run HeteroAccel Tests
        working-directory: ${{github.workspace}}/build
        run: |
          ctest \
            --build-config ${{env.BUILD_TYPE}} \
            --output-on-failure \
            --parallel 2

      # 10. Upload diagnostics if any step fails
      - name: Upload CMake build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heteroaccel-build-logs
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
